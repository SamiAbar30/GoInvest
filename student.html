<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - GoInvest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <span class="navbar-brand">GoInvest</span>
            <div class="navbar-user">
                <span id="welcome-user"></span>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>Post a new Business Idea</h2>
        <p>Your idea will be visible to all investors.</p>

        <form id="idea-form">
            <textarea id="idea-text" placeholder="Describe your idea here..." required></textarea>
            <button type="submit" class="btn">Post Idea</button>
        </form>
    </div>
    <h2>Project Comments (read only)</h2>
<ul id="comments-list"></ul>

<script>
  // Load comments saved by investors
  const comments = JSON.parse(localStorage.getItem("comments")) || [];
  const list = document.getElementById("comments-list");

  comments.forEach((c) => {
    const li = document.createElement("li");
    li.style.border = "1px solid #ccc";
    li.style.padding = "8px";
    li.style.marginBottom = "5px";
    li.innerHTML = `<strong>${c.author}</strong> 
      <span style="color:gray; font-size:12px;">(${c.time})</span><br>${c.text}`;
    list.appendChild(li);
  });
  
</script>


    <script src="app.js"></script>
    <section style="max-width:720px;margin:24px auto;padding:16px;border:1px solid #e5e7eb;border-radius:8px;">
        <h2>Attachments</h2>
        <form id="newProjectForm">
          <label>Title* <input id="title" required></label><br><br>
          <label>Description* <textarea id="description" rows="4" required></textarea></label><br><br>
          <label>Attachments (optional, max 3 — pdf/png/jpg, ≤5MB each)
            <input id="attachments" type="file" multiple>
          </label>
          <p id="formError" style="color:#b91c1c;"></p>
          <button type="submit">Publish</button>
        </form>
      </section>
      
      <script>
        // --- demo storage (no server) ---
        const DEMO_DB_KEY = "goinvest_demo_projects";
        const readDB = () => JSON.parse(localStorage.getItem(DEMO_DB_KEY) || "[]");
        const writeDB = (rows) => localStorage.setItem(DEMO_DB_KEY, JSON.stringify(rows));
      
        function validateFiles(files) {
          const allowed = ["application/pdf","image/png","image/jpeg"];
          if (files.length > 3) return "You can upload at most 3 files.";
          for (const f of files) {
            if (!allowed.includes(f.type)) return "Invalid file type. Only pdf, png, jpg allowed.";
            if (f.size > 5 * 1024 * 1024) return "File too large. Max 5MB.";
          }
          return null;
        }
      
        document.getElementById("newProjectForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const err = document.getElementById("formError");
          err.textContent = "";
      
          const title = document.getElementById("title").value.trim();
          const description = document.getElementById("description").value.trim();
          const files = document.getElementById("attachments").files;
      
          if (!title || !description) { err.textContent = "Title and description are required."; return; }
          const fErr = validateFiles(files);
          if (fErr) { err.textContent = fErr; return; }
      
          // Convert files to object URLs for demo viewing (not persisted across browsers)
          const attachments = Array.from(files).map(f => ({
            name: f.name,
            size: f.size,
            type: f.type,
            url: URL.createObjectURL(f) // demo-only viewer
          }));
      
          const id = crypto.randomUUID();
          const rows = readDB();
          rows.push({
            id, title, description,
            author: "Student (demo)",
            createdAt: new Date().toISOString(),
            attachments
          });
          writeDB(rows);
      
          // redirect to details page like the story requires
          window.location.href = `project.html?id=${id}`;
        });
      </script>
      
</body>
</html>
