<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoInvest - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1>GoInvest 🚀</h1>
        <h2>Create an Account</h2>
        
        <form id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            
            <div class="form-group role-selection">
                <p>I am a:</p>
                <input type="radio" id="role-student" name="role" value="student" required checked>
                <label for="role-student">Student</label>
                
                <input type="radio" id="role-investor" name="role" value="investor" required>
                <label for="role-investor">Investor</label>
            </div>
            
            <button type="submit" class="btn">Register</button>
        </form>
        
        <p id="message" class="message"></p>

        <p class="form-switch">
            Already have an account? <a href="index.html">Login here</a>
        </p>
    </div>
    <script src="app.js"></script>
</body>
</html>
