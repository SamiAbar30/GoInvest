<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Dashboard - GoInvest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <span class="navbar-brand">GoInvest</span>
            <div class="navbar-user">
                <span id="welcome-user"></span>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>Student Ideas</h2>
        
        <div id="ideas-container">
            </div>
    </div>
    <h2>Project Comments</h2>

<div id="comment-section">
  <textarea id="comment-input" placeholder="Write your feedback..." maxlength="1000"></textarea>
  <div id="error-message" style="color:red; font-size:14px;"></div>
  <br>
  <button id="publish-btn">Publish</button>
  <button id="clear-btn">Clear</button>

  <h3>All Comments</h3>
  <ul id="comments-list"></ul>
</div>




    <script src="app.js"></script>
</body>
</html>
