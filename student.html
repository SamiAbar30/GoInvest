<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - GoInvest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <span class="navbar-brand">GoInvest</span>
            <div class="navbar-user">
                <span id="welcome-user"></span>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>Post a new Business Idea</h2>
        <p>Your idea will be visible to all investors.</p>

        <form id="idea-form">
            <textarea id="idea-text" placeholder="Describe your idea here..." required></textarea>
            <button type="submit" class="btn">Post Idea</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
